name: Deploy Jekyll with GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - '**/*'
  workflow_dispatch:
  schedule:
    - cron: '0 0 */2 * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    # Adicionando estratégia para tentar novamente em caso de falha
    strategy:
      max-parallel: 1
      fail-fast: false
      retry-on-error: true
      retry-count: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        # Continua mesmo se houver avisos
        continue-on-error: true

      - name: Generate files metadata
        run: npm start
        env:
          GITHUB_TOKEN: ${{ secrets.MY_PAGES_GITHUB_TOKEN }}
        # Adicionando timeout para evitar execução infinita
        timeout-minutes: 10

      - name: Commit metadata changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add files_metadata.json
          git diff --cached --quiet || git commit -m "Automatic metadata update [skip ci]"
          git push
        # Continua mesmo se não houver mudanças para commitar
        continue-on-error: true

  build:
    needs: setup
    runs-on: ubuntu-latest
    # Adicionando estratégia de repetição
    strategy:
      max-parallel: 1
      fail-fast: false
      retry-on-error: true
      retry-count: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
        timeout-minutes: 15

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # Permitir que o job continue mesmo se o build falhar
    if: always()
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        # Tentar novamente em caso de falha
        retry-on-error: true
        max-attempts: 3

      # Notificação em caso de falha
      - name: Notify on failure
        if: failure()
        run: |
          echo "Deployment failed! Check the logs for details."
          # Aqui você pode adicionar notificações via Slack, Email, etc.
          # Exemplo com Slack:
          # curl -X POST -H 'Content-type: application/json' --data '{"text":"Deployment failed!"}' $SLACK_WEBHOOK_URL
