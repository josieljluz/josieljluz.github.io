name: PlayLists2 Updater

on:
  schedule:
    - cron: '5 3,15 * * *'  # Runs at 00:05 and 12:05 BRT (03:05 and 15:05 UTC)
  workflow_dispatch:  # Allows manual execution

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        repository: josieljluz/josieljluz.github.io
        token: ${{ secrets.MY_PAGES_GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run PlayLists2 script
      run: python PlayLists2.py

    - name: Update timestamps
      run: |
        for file in PlayLists2/*; do
          echo "# Atualizado em $(TZ='America/Fortaleza' date '+%d/%m/%Y - %H:%M:%S') BRT" >> "$file"
        done

    - name: Verify downloaded files
      run: ls -la PlayLists2

    - name: Configure Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Check for changes
      id: git-check
      run: |
        git add PlayLists2/
        if git diff-index --quiet HEAD --; then
          echo "changes=false" >> $GITHUB_ENV
        else
          echo "changes=true" >> $GITHUB_ENV
          git commit -m "Automatic PlayLists2 update [skip ci]"
        fi

    - name: Push changes
      if: env.changes == 'true'
      run: |
        git pull --rebase
        git push origin main

    - name: Notify success
      if: success()
      run: echo "Workflow completed successfully at $(date)"

    - name: Notify failure and debug
      if: failure()
      run: |
        echo "::error::Workflow failed at $(date)"
        echo "=== Script logs ==="
        cat PlayLists2.log 2>/dev/null || echo "No log file found"
        echo "=== Downloaded files ==="
        ls -la PlayLists2/ 2>/dev/null || echo "No files downloaded"
        echo "=== Network check ==="
        ping -c 2 m3u4u.com || echo "Ping test failed"
        exit 1
