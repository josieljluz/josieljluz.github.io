nome: Atualizador TiviMate

em:
  agenda:
    - cron: '1 3,15 * * *'  # Executa às 00:01 e 12:01 BRT (03:01 e 15:01 UTC)
  disparo_manual:  # Permite execução manual via interface do GitHub

trabalhos:
  atualizar_playlists:
    executa-em: ubuntu-latest

    passos:
    - nome: Baixar repositório
      usa: actions/checkout@v4
      com:
        token: ${{ secrets.MY_PAGES_GITHUB_TOKEN }}  # Adiciona autenticação para checkout

    - nome: Configurar Python
      usa: actions/setup-python@v4
      com:
        versão-python: '3.8'

    - nome: Cache de dependências pip
      usa: actions/cache@v3
      com:
        caminho: ~/.cache/pip
        chave: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        chaves-de-restauração: |
          ${{ runner.os }}-pip-

    - nome: Instalar dependências
      executa: |
        python -m pip instalar --upgrade pip
        pip instalar requests

    - nome: Executar script TiviMate
      executa: python TiviMate.py

    - nome: Adicionar data de atualização nos arquivos
      executa: |
        para arquivo in $(encontrar playlists -tipo f); faça
          echo "# Atualizado em $(TZ='America/Fortaleza' data '+%d/%m/%Y - %H:%M:%S') BRT" >> "$arquivo"
        feito

    - nome: Verificar arquivos baixados
      executa: ls -la playlists

    - nome: Verificar mudanças no Git
      id: status_git
      executa: |
        se [[ -n "$(git status --porcelain)" ]]; então
          echo "mudanças=verdadeiro" >> $GITHUB_ENV
        senão
          echo "mudanças=falso" >> $GITHUB_ENV
        fi

    - nome: Confirmar e enviar alterações (se houver mudanças)
      se: env.mudanças == 'verdadeiro'
      executa: |
        git config --global user.name "bot-github-actions"
        git config --global user.email "bot-github-actions@users.noreply.github.com"
        git adicionar playlists/
        git confirmar -m "Atualização automática das playlists em $(data '+%d/%m/%Y %H:%M')"
        git puxar --rebase origem principal
        git enviar https://x-access-token:${{ secrets.MY_PAGES_GITHUB_TOKEN }}@github.com/josieljluz/josieljluz.github.io.git principal

    - nome: Notificar sucesso
      se: sucesso()
      executa: |
        echo "Playlists atualizadas com sucesso!"

    - nome: Notificar falha
      se: falha()
      executa: |
        echo "Falha ao atualizar playlists!"
        echo "Erro: ${{ github.event.pull_request.html_url || github.event.head_commit.url }}"
